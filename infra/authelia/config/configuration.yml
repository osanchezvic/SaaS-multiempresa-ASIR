server:
  host: 0.0.0.0
  port: 9091

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
    password:
      algorithm: argon2
      iterations: 3
      memory: 65536
      parallelism: 4
      key_length: 32

session:
  name: authelia_session
  secret: "${AUTHELIA_SESSION_SECRET}"
  expiration: 1h
  inactivity: 5m
  domain: tensaas.es
  redis:
    host: redis
    port: 6379

storage:
  encryption_key: "${AUTHELIA_STORAGE_ENCRYPTION_KEY}"
  local:
    path: /config/db.sqlite3

jwt_secret: "${AUTHELIA_JWT_SECRET}"

identity_validation:
  reset_password:
    jwt_secret: "${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}"

access_control:
  default_policy: deny
  rules:
    - domain: "auth.tensaas.es"
      policy: bypass

    # Bypass para acciones públicas
    - domain: "panel.tensaas.es"
      resources: ["^/index.php\\?action=contact$"]
      policy: bypass

    # REGLA MAESTRA PARA ADMINS: 2FA EN TODOS LOS SITIOS
    - domain: ["panel.tensaas.es", "grafana.tensaas.es", "portainer.tensaas.es", "*.tensaas.es"]
      subject: "group:admins"
      policy: two_factor

    # REGLAS PARA CLIENTES: 1FA Y SOLO SUS SITIOS
    - domain: "panel.tensaas.es"
      subject: "group:users"
      policy: one_factor

    # Esquema real de dominios: <servicio>-<empresa>.tensaas.es (con guion).
    # Se usa domain_regex porque el wildcard "*.empresa.tensaas.es" (separado
    # por puntos) NUNCA casaba con "wordpress-panaderia.tensaas.es".
    - domain_regex:
        - "^([a-z0-9]+-)?panaderia\\.tensaas\\.es$"
      subject: "group:users"
      policy: one_factor

    - domain_regex:
        - "^([a-z0-9]+-)?btravel\\.tensaas\\.es$"
      subject: "group:users"
      policy: one_factor

totp:
  issuer: TenSaaS

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 5m

notifier:
  filesystem:
    filename: /config/notification.txt
