# ============================================================
# Puente Authelia para auth_request (incluido en TODOS los hosts)
# Define la location = /authelia que usa `auth_request /authelia;` de
# cada proxy host. Apunta al endpoint de verificacion de Authelia
# (200 si autenticado, 401 si no).
# ============================================================

location = /authelia {
    internal;
    proxy_pass http://authelia:9091/api/verify;
    proxy_set_header Host $host;
    proxy_set_header X-Original-URL https://$http_host$request_uri;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header Content-Length "";
    proxy_pass_request_body off;
}

# Destino del "error_page 401 = @error401" de cada host: redirige al
# portal de Authelia con el parametro rd de retorno. Se usa una NAMED
# location (no un redirect interno /authelia/?rd=...) a proposito: el
# redirect interno metia "rd=http://..." en $query_string y el
# block-exploits de NPM (regla anti-SSRF "=http://") devolvia 403 cuando
# el tunel de Cloudflare llegaba por HTTP. Aqui la URL va en la cabecera
# Location de la RESPUESTA, que block-exploits no inspecciona.
location @error401 {
    return 302 https://auth.tensaas.es/?rd=https://$http_host$request_uri;
}
