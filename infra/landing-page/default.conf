server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Web estática de la landing
    location / {
        try_files $uri $uri/ =404;
    }

    # Formulario de contacto → API FastAPI (mismo infra_net).
    # Mantiene el token de Telegram en el servidor: el navegador solo
    # ve /contact (same-origin), nunca la Bot API.
    location = /contact {
        proxy_pass http://infra_api:8000/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page   500 502 503 504  /50x.html;
}
